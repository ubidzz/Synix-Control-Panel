// Action: Source dedicated server configuration

// Server identity and access
hostname            "{ServerName}"
sv_password         "{Password}"
rcon_password       "{RCONPassword}"
maxplayers          {MaxPlayers}

// Public server discovery
sv_forcelan         0
sv_lan              0
heartbeat

// Team play
mp_teamplay         0 // Enable teams
mp_threeteams       0 // Use three teams for team play
mp_friendlyfire     1 // Allow friendly fire
mp_tkpunish         1 // Punish repeated team kills

// Game modes
mp_instagib         0
mp_allowctb         0
mp_allowdante       0
mp_allowvip         0
mp_allowcustom      0

// Match rules
mp_timelimit        20
mp_fraglimit        0
mp_maxrounds        0
mp_playerlives      0
mp_roundtimelimit   5
mp_forcerespawn     0

// Equipment
mp_forcerandom      0
mp_allowequip       3
mp_allowpickup      3

// Safety and logging
sv_cheats           0
log on
sv_logfile          1
sv_logecho          1
sv_logbans          1
